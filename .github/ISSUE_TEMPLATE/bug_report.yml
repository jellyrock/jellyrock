name: Bug report
description: Report a bug in JellyRock
title: ""
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Five quick fields are required so we can triage and reproduce — everything else is optional.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. What you saw, what you expected,
        and anything else relevant. (You don't need to fill out separate
        "expected" and "actual" fields — describe both here.)
      placeholder: When I press OK on the home screen library tile, the app freezes
        for 5 seconds before navigating. I expected the navigation to be
        immediate.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the bug. Include the
        navigation path on your Roku.
      placeholder: |
        1. Sign in to Jellyfin server
        2. Navigate to the Movies library
        3. Press OK on the first tile
        4. Bug occurs
    validations:
      required: true

  - type: input
    id: jellyrock_version
    attributes:
      label: JellyRock client version
      description: "Found in JellyRock's Settings screen. Example: 2.16.0"
      placeholder: 2.16.0
    validations:
      required: true

  - type: textarea
    id: roku_device
    attributes:
      label: Roku device info
      description: "Roku model and OS version. Both are in your Roku at Settings →
        System → About."
      placeholder: |
        Model: 4802X
        OS: 14.5.4
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Server connection type
      description: How JellyRock connects to your Jellyfin server. Bug behavior often
        depends on direct-play vs transcoding, which depends on this.
      options:
        - Local network, HTTP
        - Local network, HTTPS
        - Remote (over the internet), HTTP
        - Remote (over the internet), HTTPS
        - Not sure
    validations:
      required: true

  - type: input
    id: jellyfin_version
    attributes:
      label: Jellyfin server version (optional)
      description: "Helpful for server-side bug triage. Found in your Jellyfin
        server's admin dashboard. Example: 10.11.8"
      placeholder: 10.11.8
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: BrightScript console output, Jellyfin server log, network capture —
        whatever's relevant. Triple-backtick blocks render best.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag-and-drop attaches images.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context (optional)
      description: Anything else that might help — recent changes, related issues,
        workarounds tried.
    validations:
      required: false
