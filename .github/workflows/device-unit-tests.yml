name: Device Unit Tests

# SECURITY NOTE: This workflow uses pull_request_target to allow fork PRs access to secrets.
# This is required for external contributors to run tests on the physical Roku device.
#
# IMPORTANT: The `all-tests` job uses the `roku-device` environment which requires
# manual approval from a maintainer before running. This is the correct gate for
# pull_request_target — the standard "require approval for outside collaborators"
# setting does NOT apply to pull_request_target events.
#
# See: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk
#
# No event-time `paths:` filter — see .github/actions/changed-paths/action.yml.
# `check-skip` short-circuits internally when no test-relevant files changed,
# so both `check-skip` and `all-tests` always report a status and can be wired
# as required checks without stalling PRs that don't touch source / tests.

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test type to run"
        required: true
        default: "all"
        type: choice
        options:
          - unit
          - integration
          - all
          - complete

# Restrict the default GITHUB_TOKEN to read-only contents access. This workflow
# only checks out code, installs deps, and runs tests on the Roku — it never
# pushes, comments, or otherwise mutates the repo. Without this, a malicious
# pull_request_target PR could harvest the broadly-scoped default token from
# .git/config (left there by actions/checkout) and use it to push to main.
permissions:
  contents: read

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.combined.outputs.skip }}
    steps:
      # Checkout is needed so the `./.github/actions/changed-paths` composite
      # action can be loaded. Under pull_request_target this is the BASE
      # branch's copy of the action — PR-controlled action code never runs
      # with the elevated token, which is the same security posture as the
      # rest of this workflow.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check if push is from PR merge
        id: merge_check
        # COMMIT_MSG is passed via env, NOT interpolated into the shell. A commit
        # message is attacker-controllable; `${{ github.event.head_commit.message }}`
        # expanded directly into a `run:` line lets backticks / $(...) in the message
        # execute as the line is parsed (GitHub Actions script-injection — a real
        # backtick-heavy merge commit tripped exactly this). env values are not
        # shell-parsed, so the quoted "$COMMIT_MSG" is inert. (event_name/ref are
        # controlled values, safe to interpolate.)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if printf '%s' "$COMMIT_MSG" | grep -q "Merge pull request"; then
              echo "This is a PR merge to main - tests already ran on PR"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "This is a direct push to main"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "This is a PR or manual trigger"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect test-relevant changes
        id: path_check
        uses: ./.github/actions/changed-paths
        with:
          # Files whose changes can affect the Roku-device test run:
          #   tests/source/** (the BrightScript suites — NOT tests/scripts/**,
          #   which are Node/Vitest tests run by the separate `vitest` job),
          #   source/**, components/**, settings/settings.json, bsconfig.json,
          #   bsconfig-tests*.json, package.json, package-lock.json
          pattern: '^(tests/source/|source/|components/|settings/settings\.json$|bsconfig\.json$|bsconfig-tests[^/]*\.json$|package(-lock)?\.json$)'

      - name: Combine skip reasons
        id: combined
        run: |
          if [[ "${{ steps.merge_check.outputs.skip }}" == "true" ]]; then
            echo "Skipping: push is a PR merge to main (tests already ran on PR)"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.path_check.outputs.relevant }}" == "false" ]]; then
            echo "Skipping: PR did not touch test-relevant files"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Running: tests will execute"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  all-tests:
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true' && github.actor != 'jellyrock[bot]'
    runs-on: [self-hosted, roku-device]
    timeout-minutes: 15
    # Requires manual approval from a maintainer before this job runs.
    # This is the correct protection for pull_request_target — environment protection
    # rules gate at the job level regardless of who opened the PR.
    environment: roku-device
    steps:
      # Explicitly checkout PR code - pull_request_target defaults to base branch.
      # persist-credentials: false prevents actions/checkout from writing the
      # GITHUB_TOKEN into .git/config; combined with the workflow-level
      # `permissions: contents: read` above, this means PR code can't harvest
      # a write-capable token from the workspace.
      #
      # allow-unsafe-pr-checkout: checkout v7 (actions/checkout#2454) refuses to
      # check out fork-PR head code under pull_request_target unless this opt-in
      # is set. It's safe here because the fork code can't reach a write-token or
      # secrets without first clearing the `environment: roku-device` manual
      # maintainer-approval gate above (plus persist-credentials:false +
      # contents:read). See https://gh.io/securely-using-pull_request_target.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
          cache: "npm"

      # Security: --ignore-scripts blocks transitive deps' install/postinstall hooks,
      # which is the highest-bandwidth pull_request_target exfiltration path
      # (a malicious PR adds a dep whose postinstall reads runner env vars).
      # We then run our OWN postinstall steps by name — `ropm` and `patches:apply`
      # are vetted scripts in this repo. Patch content lives under `patches/`
      # (committed) and is applied to `node_modules/`; no PR-controlled execution.
      # If a future trusted dep needs install scripts, add it to an explicit
      # `npm rebuild <pkg>` line below — never re-enable scripts globally.
      - name: Install dependencies (security-hardened)
        run: |
          npm ci --ignore-scripts
          npm run ropm
          npm run patches:apply

      - name: Run unit tests on Roku
        if: github.event.inputs.test_type == 'unit'
        run: npm run test:unit
        env:
          ROKU_IP: ${{ secrets.ROKU_DEVICE_IP }}
          ROKU_PASSWORD: ${{ secrets.ROKU_DEVICE_PASSWORD }}

      - name: Run integration tests on Roku
        if: github.event.inputs.test_type == 'integration'
        run: npm run test:integration
        env:
          ROKU_IP: ${{ secrets.ROKU_DEVICE_IP }}
          ROKU_PASSWORD: ${{ secrets.ROKU_DEVICE_PASSWORD }}

      - name: Run all tests on Roku
        if: github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch'
        run: npm run test:all
        env:
          ROKU_IP: ${{ secrets.ROKU_DEVICE_IP }}
          ROKU_PASSWORD: ${{ secrets.ROKU_DEVICE_PASSWORD }}

      - name: Run complete tests on Roku (including migration and registry)
        if: github.event.inputs.test_type == 'complete'
        run: npm run test:complete
        env:
          ROKU_IP: ${{ secrets.ROKU_DEVICE_IP }}
          ROKU_PASSWORD: ${{ secrets.ROKU_DEVICE_PASSWORD }}

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roku-test-logs-${{ github.event.inputs.test_type || 'all' }}
          path: roku-test-output.log
          retention-days: 30
