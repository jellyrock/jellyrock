name: Device Unit Tests

# SECURITY NOTE: This workflow uses pull_request_target to allow fork PRs access to secrets.
# This is required for external contributors to run tests on the physical Roku device.
#
# IMPORTANT: fork PRs are gated by the `fork-gate` job below, which sits behind the
# `roku-device` environment's required-reviewer rule; `all-tests` needs it, so fork
# code cannot reach the runner until a maintainer approves. Same-repo branches skip
# the gate and run unattended.
#
# The repo-level "require approval for outside collaborators" setting does NOT cover
# pull_request_target and must not be relied on here. That is not theoretical: this
# repo took a malicious fork PR through this exact path while that setting was
# enabled. An earlier revision put `environment: roku-device` directly on all-tests;
# that gated OUR pushes too, so it was dropped once the hardening below landed —
# which left forks ungated, because the hardening does not cover every path (see the
# fork-gate comment). The split-job form restores the gate for forks only.
#
# See: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk
#
# No event-time `paths:` filter — see .github/actions/changed-paths/action.yml.
# `check-skip` short-circuits internally when no test-relevant files changed,
# so both `check-skip` and `all-tests` always report a status and can be wired
# as required checks without stalling PRs that don't touch source / tests.
# This applies to PRs AND direct pushes to main: changed-paths resolves a
# push's file list via the compare API (before...after), so a push that
# touches only docs / lint scripts / workflows / tests/scripts skips the
# ~10-min device run instead of spinning the physical Roku for nothing.

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test type to run"
        required: true
        default: "all"
        type: choice
        options:
          - unit
          - integration
          - all
          - complete

# Restrict the default GITHUB_TOKEN to read-only contents access. This workflow
# only checks out code, installs deps, and runs tests on the Roku — it never
# pushes, comments, or otherwise mutates the repo. Without this, a malicious
# pull_request_target PR could harvest the broadly-scoped default token from
# .git/config (left there by actions/checkout) and use it to push to main.
permissions:
  contents: read

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.combined.outputs.skip }}
    steps:
      # Checkout is needed so the `./.github/actions/changed-paths` composite
      # action can be loaded. Under pull_request_target this is the BASE
      # branch's copy of the action — PR-controlled action code never runs
      # with the elevated token, which is the same security posture as the
      # rest of this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if push is from PR merge
        id: merge_check
        # COMMIT_MSG is passed via env, NOT interpolated into the shell. A commit
        # message is attacker-controllable; `${{ github.event.head_commit.message }}`
        # expanded directly into a `run:` line lets backticks / $(...) in the message
        # execute as the line is parsed (GitHub Actions script-injection — a real
        # backtick-heavy merge commit tripped exactly this). env values are not
        # shell-parsed, so the quoted "$COMMIT_MSG" is inert. (event_name/ref are
        # controlled values, safe to interpolate.)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if printf '%s' "$COMMIT_MSG" | grep -q "Merge pull request"; then
              echo "This is a PR merge to main - tests already ran on PR"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "This is a direct push to main"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "This is a PR or manual trigger"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect test-relevant changes
        id: path_check
        uses: ./.github/actions/changed-paths
        with:
          # Files whose changes can affect the Roku-device test run:
          #   tests/source/** (the BrightScript suites — NOT tests/scripts/**,
          #   which are Node/Vitest tests run by the separate `vitest` job),
          #   source/**, components/**, settings/settings.json, bsconfig.json,
          #   bsconfig-tests*.json, package.json, package-lock.json
          pattern: '^(tests/source/|source/|components/|settings/settings\.json$|bsconfig\.json$|bsconfig-tests[^/]*\.json$|package(-lock)?\.json$)'

      - name: Combine skip reasons
        id: combined
        run: |
          if [[ "${{ steps.merge_check.outputs.skip }}" == "true" ]]; then
            echo "Skipping: push is a PR merge to main (tests already ran on PR)"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.path_check.outputs.relevant }}" == "false" ]]; then
            echo "Skipping: PR did not touch test-relevant files"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Running: tests will execute"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # ── The fork gate ────────────────────────────────────────────────────────
  #
  # Does nothing. Its ONLY job is to sit behind the `roku-device` environment's
  # required-reviewer rule, so that `all-tests` (which needs it) cannot start on
  # a fork PR until a maintainer has approved. Same-repo branches skip it and
  # run unattended, exactly as before.
  #
  # Why a separate job rather than `environment:` on all-tests itself: an
  # environment is job-level and unconditional, so putting it on all-tests would
  # gate OUR pushes too. A conditional `environment: ${{ ... }}` expression was
  # considered and rejected — whether an empty result means "no environment" is
  # not documented, and this is the control standing between a stranger's code
  # and a self-hosted runner on a home LAN. It should not rest on undocumented
  # expression semantics.
  #
  # Why this gate exists at all: `pull_request_target` hands secrets to a
  # workflow that then checks out FORK-authored code, and GitHub's
  # "require approval for outside collaborators" setting does NOT cover
  # pull_request_target. That was confirmed the hard way — this repo took a
  # malicious fork PR through exactly this path while that setting was enabled.
  # The hardening below (contents:read, persist-credentials:false,
  # --ignore-scripts) closes the token and dependency-postinstall paths, but the
  # explicitly-invoked npm scripts (`ropm`, `patches:apply`, `test:all`) still
  # run the PR's OWN copies of package.json / scripts/ / patches/ with the Roku
  # secrets in env. Human review of the diff is what covers that.
  fork-gate:
    needs: check-skip
    # Scoped to pull_request_target on purpose: on `push` / `workflow_dispatch`
    # there is no pull_request payload, so head.repo.full_name would be empty,
    # compare unequal, and demand approval for pushes to main.
    if: >-
      github.event_name == 'pull_request_target'
      && needs.check-skip.outputs.should_skip != 'true'
      && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: roku-device
    steps:
      - run: echo "Maintainer approved device tests for fork PR #${{ github.event.pull_request.number }}."

  all-tests:
    needs: [check-skip, fork-gate]
    # `!cancelled()` is required because a SKIPPED `needs` would otherwise skip
    # this job too, and fork-gate is skipped on every same-repo run.
    #
    # fork-gate is checked as an ALLOWLIST of results, not a denylist, so it
    # fails closed — anything unexpected blocks rather than falls through:
    #   same-repo PR / push  → fork-gate 'skipped'  → run  (unattended, as before)
    #   fork PR, approved    → fork-gate 'success'  → run
    #   fork PR, pending     → fork-gate not done   → all-tests waits
    #   fork PR, rejected    → fork-gate 'cancelled'→ blocked
    # `check-skip.result == 'success'` matters for the same reason: without it a
    # FAILED check-skip yields an empty `should_skip`, which would satisfy
    # `!= 'true'` and let a fork run with fork-gate skipped.
    if: >-
      !cancelled()
      && needs.check-skip.result == 'success'
      && needs.check-skip.outputs.should_skip != 'true'
      && github.actor != 'jellyrock[bot]'
      && (needs.fork-gate.result == 'success' || needs.fork-gate.result == 'skipped')
    runs-on: [self-hosted, roku-device]
    timeout-minutes: 15
    steps:
      # Explicitly checkout PR code - pull_request_target defaults to base branch.
      # persist-credentials: false prevents actions/checkout from writing the
      # GITHUB_TOKEN into .git/config; combined with the workflow-level
      # `permissions: contents: read` above, this means PR code can't harvest
      # a write-capable token from the workspace.
      #
      # allow-unsafe-pr-checkout: checkout v7 (actions/checkout#2454) refuses to
      # check out fork-PR head code under pull_request_target unless this opt-in
      # is set. Fork code can't reach a write-token (persist-credentials:false +
      # contents:read), and can't reach the runner at all until the `fork-gate`
      # job's maintainer approval clears.
      # See https://gh.io/securely-using-pull_request_target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"

      # Security: --ignore-scripts blocks transitive deps' install/postinstall hooks,
      # which is the highest-bandwidth pull_request_target exfiltration path
      # (a malicious PR adds a dep whose postinstall reads runner env vars).
      # We then run our OWN postinstall steps by name — `ropm` and `patches:apply`
      # are vetted scripts in this repo. Patch content lives under `patches/`
      # (committed) and is applied to `node_modules/`; no PR-controlled execution.
      # If a future trusted dep needs install scripts, add it to an explicit
      # `npm rebuild <pkg>` line below — never re-enable scripts globally.
      - name: Install dependencies (security-hardened)
        run: |
          npm ci --ignore-scripts
          npm run ropm
          npm run patches:apply

      - name: Run unit tests on Roku
        if: github.event.inputs.test_type == 'unit'
        run: npm run test:unit
        env:
          ROKU_IP: ${{ secrets.ROKU_DEVICE_IP }}
          ROKU_PASSWORD: ${{ secrets.ROKU_DEVICE_PASSWORD }}

      - name: Run integration tests on Roku
        if: github.event.inputs.test_type == 'integration'
        run: npm run test:integration
        env:
          ROKU_IP: ${{ secrets.ROKU_DEVICE_IP }}
          ROKU_PASSWORD: ${{ secrets.ROKU_DEVICE_PASSWORD }}

      - name: Run all tests on Roku
        if: github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch'
        run: npm run test:all
        env:
          ROKU_IP: ${{ secrets.ROKU_DEVICE_IP }}
          ROKU_PASSWORD: ${{ secrets.ROKU_DEVICE_PASSWORD }}

      - name: Run complete tests on Roku (including migration and registry)
        if: github.event.inputs.test_type == 'complete'
        run: npm run test:complete
        env:
          ROKU_IP: ${{ secrets.ROKU_DEVICE_IP }}
          ROKU_PASSWORD: ${{ secrets.ROKU_DEVICE_PASSWORD }}

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roku-test-logs-${{ github.event.inputs.test_type || 'all' }}
          path: roku-test-output.log
          retention-days: 30

      # The run record, ALWAYS — the counterpart to the same step in
      # rta-functional-tests.yml, and the reason `run-roku-tests.js` records an
      # `outcome` at all. #800 went red on a ROOIBOS test against the shared demo
      # server, and the experiment that re-derives it needs a local RTA run and a CI
      # Rooibos run to be comparable from BOTH sides afterwards. Without this the
      # Rooibos ledger dies with the runner and that side is unreadable, which would
      # leave `run-roku-tests.js`'s own comment claiming a capability the repo does
      # not have.
      #
      # `if: always()` because a RED run is the interesting one. Adds no egress path:
      # the step above already uploads a full telnet console dump from the same job,
      # and this file carries only commit sha, timings, the `sha256(device-id)` key
      # and the holder record — `recordFailure` lives in the RTA harness, so a
      # Rooibos run's `failures` is always empty. upload-artifact authenticates with
      # ACTIONS_RUNTIME_TOKEN, so `contents: read` is untouched.
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roku-run-record-${{ github.event.inputs.test_type || 'all' }}
          path: |
            .device-runs/device/runs.jsonl
            out/device/run-meta.json
          retention-days: 30
          if-no-files-found: warn
