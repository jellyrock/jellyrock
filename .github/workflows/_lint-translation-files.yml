name: lint-translation-files

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Clone github repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # Mirrors the previous event-time paths filter.
          pattern: '^(locale/custom/.+\.json|source/.+\.bs|components/.+\.(bs|xml)|settings/settings\.json|scripts/update-translations\.cjs)$'
          force: ${{ inputs.force }}
      - name: Setup Node.js
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies
        if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - name: Lint translation files
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:translations
