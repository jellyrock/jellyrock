name: test-scripts

# Runs Vitest unit tests for the build/lint/codegen scripts under
# scripts/. Tests cover BSC plugins (4 diagnostic-emitting + 2 smoke),
# helper libs, doc validators, output generators, telemetry aggregator,
# and a handful of external-system wrappers.
#
# Mirrors the pre-push hook's test step. CI is the safety net for
# `--no-verify` and the per-PR mandatory gate for fork PRs (where
# pre-push hooks don't fire).
#
# Tier 2 plugins (roku-log, translation-keys) get smoke coverage here;
# their full transpile-output / virtual-file harnesses are deferred to
# a follow-up — see tasks/todo/bsc-plugin-tier2-harness.md.
# The two heaviest scripts (update-translations.cjs, changelog-syncer.js)
# are also deferred — see tasks/todo/heavy-script-tests.md.

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # Triggers when any JS source under scripts/ changes, when the
          # tests themselves change, or when the test config changes.
          # We deliberately don't trigger on every JS/JSON change — the
          # tests focus on scripts/ and tests/scripts/, so unrelated JS edits
          # don't need re-running.
          # images/gradients/ is here because gradient-assets.test.js asserts
          # the COMMITTED assets still match the generator; without it a PR that
          # hand-edits or reverts a ramp PNG skips the job and lands green.
          # .lintstagedrc.cjs and .spellcheckerrc.yaml are here for the same
          # reason: spellchecker-config.test.js asserts no invocation site
          # re-specifies a setting the shared config owns, and .lintstagedrc.cjs
          # is one of those sites. Without them a PR re-adding `-i` there alone
          # skips the one gate that exists to catch it — which is precisely the
          # drift that gate was written for. See ci-path-filters-unverified.
          pattern: '^scripts/|^tests/scripts/|^images/gradients/|^vitest\.config\.js$|^package(-lock)?\.json$|^\.lintstagedrc\.cjs$|^\.spellcheckerrc\.ya?ml$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - if: steps.detect.outputs.relevant == 'true'
        run: npm run test:scripts
