name: validate-dependencies

# Re-runs every linter unconditionally on dependency-update PRs (label
# `dependencies` triggers the calling workflow). Each `_lint-X.yml` is
# called with `force: true`, which makes the `changed-paths` composite
# action skip its PR-diff check and run the lint regardless of what
# files the PR touched.
#
# Why force: a dep bump (BSC, markdownlint, jshint, spellchecker-cli,
# rooibos, etc.) can break a linter even when the PR only changes
# package.json / package-lock.json — i.e., no source file matches any
# linter's path pattern. Without `force`, every linter would short-circuit
# to "skipped" and the dep update would land unverified.

on:
  workflow_call:

jobs:
  lint-brightscript:
    uses: ./.github/workflows/_lint-brightscript.yml
    with:
      force: true
  lint-json:
    uses: ./.github/workflows/_lint-json.yml
    with:
      force: true
  lint-markdown:
    uses: ./.github/workflows/_lint-markdown.yml
    with:
      force: true
  lint-spelling:
    uses: ./.github/workflows/_lint-spelling.yml
    with:
      force: true
  lint-translation-files:
    uses: ./.github/workflows/_lint-translation-files.yml
    with:
      force: true
