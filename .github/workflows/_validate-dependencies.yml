name: validate-dependencies

# Re-runs every lint and test reusable unconditionally on dependency-update
# PRs (label `dependencies` triggers the calling workflow). Each reusable
# is called with `force: true`, which makes the `changed-paths` composite
# action skip its PR-diff check and run regardless of what files the PR
# touched.
#
# Why force: a dep bump (BSC, ESLint, Prettier, Vitest, markdownlint,
# jshint, spellchecker-cli, rooibos, etc.) can break a check even when the
# PR only changes package.json / package-lock.json — i.e., no source file
# matches any path pattern. Without `force`, every check would short-circuit
# to "skipped" and the dep update would land unverified.
#
# This list MUST stay in sync with the set of `_*.yml` reusables in
# .github/workflows/. When you add a new reusable lint/test workflow,
# add it here too — otherwise a dep that breaks it will land green.
#
# Coverage note: this orchestrator is what makes Renovate patch automerge
# safe. Every devDep in package.json is exercised by at least one of the
# downstream jobs (lint stages, test:scripts, or _smoke-test-deps for the
# few CLIs CI doesn't otherwise touch). See renovate.json for the
# automerge rule that depends on this coverage.

on:
  workflow_call:

jobs:
  lint-brightscript:
    uses: ./.github/workflows/_lint-brightscript.yml
    with:
      force: true
  lint-docs:
    uses: ./.github/workflows/_lint-docs.yml
    with:
      force: true
  lint-issue-templates:
    uses: ./.github/workflows/_lint-issue-templates.yml
    with:
      force: true
  lint-js:
    uses: ./.github/workflows/_lint-js.yml
    with:
      force: true
  lint-json:
    uses: ./.github/workflows/_lint-json.yml
    with:
      force: true
  lint-language-coverage:
    uses: ./.github/workflows/_lint-language-coverage.yml
    with:
      force: true
  lint-markdown:
    uses: ./.github/workflows/_lint-markdown.yml
    with:
      force: true
  lint-spelling:
    uses: ./.github/workflows/_lint-spelling.yml
    with:
      force: true
  lint-translation-files:
    uses: ./.github/workflows/_lint-translation-files.yml
    with:
      force: true
  smoke-test-deps:
    uses: ./.github/workflows/_smoke-test-deps.yml
    with:
      force: true
  test-scripts:
    uses: ./.github/workflows/_test-scripts.yml
    with:
      force: true
