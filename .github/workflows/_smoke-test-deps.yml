name: smoke-test-deps

# Module-level smoke tests for devDeps that nothing else in CI exercises.
#
# Coverage matrix:
# - roku-deploy (CJS): require() the module + verify .deploy and .createPackage
#   are exported as functions. Only invoked by `npm run deploy` (manual), never
#   in CI, so without this check a bad patch could land green.
# - lint-staged (ESM): dynamic import the module + verify default export is
#   a function. Plus require() .lintstagedrc.cjs to verify the config file
#   parses (lint-staged only runs via the husky pre-commit hook locally).
#
# Husky itself is NOT smoke-tested here: `"prepare": "husky"` in package.json
# runs the husky CLI on every `npm ci`, so it's already covered.
#
# These checks load modules but DON'T invoke the CLIs. Invoking
# `roku-deploy --version` would actually try to deploy — the CLI has no
# --version flag and falls through to the default action. Module-load + API
# surface check catches catastrophic package breakage without side effects.

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^package(-lock)?\.json$|^\.github/workflows/_?smoke-test-deps\.yml$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Cache ropm dependencies
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            source/roku_modules
            components/roku_modules
          key: ropm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: ropm-
      - if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - name: roku-deploy module + API smoke test
        if: steps.detect.outputs.relevant == 'true'
        run: |
          node -e '
            const rd = require("roku-deploy");
            const pkg = require("roku-deploy/package.json");
            for (const fn of ["deploy", "createPackage", "deployAndSignPackage"]) {
              if (typeof rd[fn] !== "function") {
                console.error("roku-deploy API broken: ." + fn + " is not a function");
                process.exit(1);
              }
            }
            console.log("roku-deploy@" + pkg.version + " — module + API OK");
          '
      - name: lint-staged module + config smoke test
        if: steps.detect.outputs.relevant == 'true'
        run: |
          node --input-type=module -e '
            const ls = await import("lint-staged");
            if (typeof ls.default !== "function") {
              console.error("lint-staged API broken: default export is not a function");
              process.exit(1);
            }
            console.log("lint-staged dynamic import — default export OK");
          '
          node -e '
            require("./.lintstagedrc.cjs");
            const pkg = require("lint-staged/package.json");
            console.log("lint-staged@" + pkg.version + " — .lintstagedrc.cjs parses OK");
          '
