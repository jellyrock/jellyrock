name: lint-js

# No event-time `paths:` filter — see .github/actions/changed-paths for why.
# The reusable workflow short-circuits internally when no JS / JSON changed,
# so this can be wired as a required check without stalling PRs that don't
# touch JS or JSON.
on:
  pull_request:

jobs:
  run:
    uses: ./.github/workflows/_lint-js.yml
