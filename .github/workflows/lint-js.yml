name: lint-js

# No event-time `paths:` filter: .github/actions/changed-paths says why.
# The reusable workflow short-circuits internally when no JS, JSON or Prettier
# config changed, so this can be wired as a required check without stalling
# PRs that don't touch them.
on:
  pull_request:

jobs:
  eslint:
    uses: ./.github/workflows/_lint-js.yml
