name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  dev:
    uses: ./.github/workflows/_build-app.yml
    with:
      build_type: dev
    secrets: inherit
  prod:
    uses: ./.github/workflows/_build-app.yml
    with:
      build_type: prod
    secrets: inherit
