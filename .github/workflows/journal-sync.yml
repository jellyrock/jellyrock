# Post-merge journal sync.
#
# When a PR merges to main, this workflow runs scripts/journal-sync.js to
# perform the mechanical close-loop edit on docs/progress.md:
#   - Prepend "- YYYY-MM-DD — <pr-title>" to ## Recently shipped
#   - Clear ## Currently running when its text overlaps the PR title
#   - Bump frontmatter last-updated:
#
# Judgment-bearing entries (decisions, tech-debt, followups) stay on the
# user-driven /pr → /log path. This workflow is the auto-close-loop side
# only — see docs/architecture/system-shape.md for the full four-pillar
# pattern, and .claude/skills/pr/SKILL.md for the judgment side.
#
# Skips (no commit pushed):
#   - PRs labeled dependencies / documentation / docs-only / ci / automated
#   - PRs authored by app/dependabot, app/renovate, jellyrock[bot]
#   - PR titles matching Renovate / Dependabot / Weblate patterns
#   - Idempotency: today's date already has a Recently shipped bullet
#     overlapping the PR title (re-runs are safe)
#
# Concurrency: ONE GROUP PER PR, and that is a fix rather than a style choice.
#
# This used to share `jellyrock-bot-main` with jellyrock-bot, on the reasoning that
# both mutate the same files so a shared queue prevents stale-base push failures.
# The queue does that, and it also silently destroys work: GitHub keeps only ONE
# pending run per concurrency group, so a run waiting behind jellyrock-bot is
# CANCELLED the moment a newer run enters the group. `cancel-in-progress: false`
# does not help — it protects a run that is already executing, not a pending one.
#
# For jellyrock-bot that is survivable, because its jobs are idempotent recomputes:
# the superseding run redoes whatever the superseded one would have done (see the
# "do not re-add the actor guard" comment in jellyrock-bot.yml, which is this same
# hazard). This workflow has no such property — it ships only the ONE PR in its own
# trigger payload, so a superseded run's bullet is lost permanently, and a cancelled
# run is indistinguishable from a successful one in the run list unless somebody
# checks for the commit that never appeared.
#
# Measured, not theorised: of the runs on 2026-08-12 and 2026-08-14, #808's sync was
# cancelled and its bullet NEVER landed, and #813's was cancelled and its bullet
# exists only because a human wrote the commit by hand.
#
# Keying the group on the PR number means a journal-sync can never evict another
# journal-sync, and can never be evicted by jellyrock-bot. The stale-base risk the
# shared queue was covering is handled where it actually occurs — at the push, which
# rebases and retries (see "Commit and push"). That converts a silent, permanent
# loss into either a success or a loud red run.

name: Journal Sync (post-merge)

on:
  pull_request:
    types: [closed]

concurrency:
  group: journal-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git as the GitHub App Bot
        run: |
          APP_USER_ID=$(gh api "/users/jellyrock[bot]" --jq .id)
          git config --global user.name "jellyrock[bot]"
          git config --global user.email "${APP_USER_ID}+jellyrock[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      # Build the labels CSV and author handle from the merged PR's metadata.
      # Using the event payload directly avoids an extra `gh pr view` call.
      - name: Run journal-sync
        id: sync
        # All PR-controlled values come in via env, NOT interpolated into the shell.
        # A `${{ ...title }}` expanded into a `run:` line lets a `'` end the quote
        # (and backticks / $(...) execute) as the line is parsed — GitHub Actions
        # script-injection. env values are not shell-parsed, so "$PR_TITLE" is inert.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          echo "PR title: $PR_TITLE"
          echo "PR author: $PR_AUTHOR"
          echo "PR labels: $PR_LABELS"

          node scripts/journal-sync.js ship \
            --pr-title "$PR_TITLE" \
            --pr-author "$PR_AUTHOR" \
            --pr-labels "$PR_LABELS"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/progress.md; then
            echo "ℹ️ No journal changes to commit (skipped or already up-to-date)"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "✅ progress.md has changes"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.has_changes == 'true'
        # PR title via env (same injection reason as the Run journal-sync step) so a
        # title with a quote/backtick can't break or inject into git commit -m. The
        # number is a controlled integer, safe to interpolate.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git add docs/progress.md
          git commit -m "chore(journal): sync ${PR_TITLE} (#${PR_NUMBER})"

          # Retry the rebase-and-push rather than relying on a shared queue to make
          # races impossible. Now that this workflow has its own per-PR concurrency
          # group, another writer to main (jellyrock-bot, or another PR's sync) CAN
          # land between our fetch and our push — which is the stale-base failure the
          # shared group used to prevent, and it is cheap to absorb here: the commit
          # is already made, so a retry only has to replay it onto the new tip.
          #
          # A bounded loop, and a FAILURE at the end rather than a silent give-up:
          # exhausting the retries means main is being written faster than this can
          # keep up, which is a real condition someone should see as a red run. The
          # thing this workflow must never do again is lose a bullet quietly.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "✅ pushed on attempt ${attempt}"
              exit 0
            fi
            echo "⚠️ push attempt ${attempt} failed (main moved under us); retrying..."
            sleep $((attempt * 5))
          done

          echo "::error::journal-sync could not push after 5 attempts — main is moving faster than this workflow can rebase onto it. The bullet for #${PR_NUMBER} has NOT landed; re-run this workflow."
          exit 1
