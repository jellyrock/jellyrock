# Consolidated workflow for all JellyRock-bot automated commits
# This workflow runs sequentially to avoid git conflicts when pushing to main
#
# Jobs:
# 1. update-translation-source: Scans code for new translate() keys, updates en_US.json
# 2. sync-translations-to-weblate: Syncs en_US.json + languages.json to weblate branch
# 3. update-settings-docs: Updates settings documentation (only when settings.json changes)
# 4. sync-changelog: Syncs changelog with unreleased changes
#
# Dependency graph:
#   update-translation-source → update-settings-docs → sync-changelog
#   update-translation-source → sync-translations-to-weblate (independent, does not block main chain)

name: JellyRock Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: jellyrock-bot-main
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Job 1: Translation Source Maintenance
  # Sorts en_US.json alphabetically and syncs languages.json with locale files.
  # Missing keys are caught at build time by the BSC translation-keys plugin.
  # ============================================================================
  # NO actor guard here (unlike the weblate job below). This job is an
  # idempotent recompute gated by `git diff` before it commits, so a
  # bot-triggered run either finds nothing to do (no push, no loop) or
  # completes sync work a superseded run would otherwise have dropped.
  # An `actor != jellyrock[bot]` skip here silently loses translation/
  # changelog syncs when a bot commit (e.g. journal-sync) supersedes the
  # real-PR run in the shared jellyrock-bot-main concurrency group. Do not
  # re-add it. See git history / docs/decisions.md for the full trace.
  update-translation-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git as the GitHub App Bot
        run: |
          APP_USER_ID=$(gh api "/users/jellyrock[bot]" --jq .id)
          git config --global user.name "jellyrock[bot]"
          git config --global user.email "${APP_USER_ID}+jellyrock[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Cache ropm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            source/roku_modules
            components/roku_modules
          key: ropm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: ropm-

      - name: Install NPM dependencies
        run: npm ci

      - name: Sort en_US.json and sync languages.json
        run: npm run update-translations

      - name: Check for en_US.json changes
        id: check_changes
        run: |
          if git diff --quiet locale/custom/en_US.json locale/languages.json; then
            echo "ℹ️ No translation source changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Translation source files have changes"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit en_US.json changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git pull --rebase --autostash origin main
          git add locale/custom/en_US.json locale/languages.json
          git commit -m "chore(translation): auto-update translation source files"

      - name: Push changes to main
        if: steps.check_changes.outputs.has_changes == 'true'
        run: git push origin main

  # ============================================================================
  # Job 2: Sync Source Files to Weblate Branch
  # Copies en_US.json (source strings) and languages.json (metadata) to the
  # weblate branch so Weblate picks up new/changed keys.
  # One-way sync: main → weblate. Fails if the weblate branch does not exist.
  # ============================================================================
  sync-translations-to-weblate:
    if: github.actor != 'jellyrock[bot]'
    needs: update-translation-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git as the GitHub App Bot
        run: |
          APP_USER_ID=$(gh api "/users/jellyrock[bot]" --jq .id)
          git config --global user.name "jellyrock[bot]"
          git config --global user.email "${APP_USER_ID}+jellyrock[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify weblate branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin weblate > /dev/null 2>&1; then
            echo "::error::The 'weblate' branch does not exist on the remote. Create it before translations can be synced."
            exit 1
          fi

      - name: Sync source files to weblate branch
        run: |
          # Save developer-owned files from main
          cp locale/custom/en_US.json /tmp/en_US.json
          cp locale/languages.json /tmp/languages.json

          # Switch to weblate branch
          git fetch origin weblate
          git checkout weblate

          # Copy updated files
          cp /tmp/en_US.json locale/custom/en_US.json
          mkdir -p locale
          cp /tmp/languages.json locale/languages.json

          # Check for changes
          if git diff --quiet locale/custom/en_US.json locale/languages.json; then
            echo "ℹ️ No changes to sync to weblate branch"
            exit 0
          fi

          # Commit and push
          git add locale/custom/en_US.json locale/languages.json
          git commit -m "chore: sync source files from main"
          git push origin weblate

  # ============================================================================
  # Job 3: Settings Documentation Update
  # Only runs when settings/settings.json is modified
  # ============================================================================
  # NO actor guard — see update-translation-source above. Idempotent recompute,
  # gated by `git diff` before commit; skipping bot runs drops real-PR syncs.
  update-settings-docs:
    needs: update-translation-source
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git as the GitHub App Bot
        run: |
          APP_USER_ID=$(gh api "/users/jellyrock[bot]" --jq .id)
          git config --global user.name "jellyrock[bot]"
          git config --global user.email "${APP_USER_ID}+jellyrock[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check if settings.json changed
        id: settings_check
        run: |
          # For workflow_dispatch, always run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "settings_changed=true" >> $GITHUB_OUTPUT
            echo "🔧 Manual trigger - checking settings docs"
            exit 0
          fi

          # For push events, check if settings.json changed
          if git diff --name-only HEAD~1 HEAD | grep -q "^settings/settings.json$"; then
            echo "settings_changed=true" >> $GITHUB_OUTPUT
            echo "✅ settings.json changed - will update docs"
          else
            echo "settings_changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  settings.json not changed - skipping docs update"
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.settings_check.outputs.settings_changed == 'true'
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        if: steps.settings_check.outputs.settings_changed == 'true'
        run: npm ci

      - name: Regenerate settings docs
        if: steps.settings_check.outputs.settings_changed == 'true'
        run: npm run docs:settings

      - name: Check for settings docs changes
        if: steps.settings_check.outputs.settings_changed == 'true'
        id: check_changes
        run: |
          if git diff --quiet docs/user/app-settings.md; then
            echo "ℹ️ No settings docs changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Settings docs have changes"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit settings docs changes
        if: steps.settings_check.outputs.settings_changed == 'true' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git pull --rebase --autostash origin main
          git add docs/user/app-settings.md
          git commit -m "chore(docs): auto-update settings docs"

      - name: Push changes
        if: steps.settings_check.outputs.settings_changed == 'true' && steps.check_changes.outputs.has_changes == 'true'
        run: git push origin main

  # ============================================================================
  # Job 4: Changelog Sync
  # ============================================================================
  # NO actor guard — see update-translation-source above. Idempotent recompute,
  # gated by `git diff` before commit; skipping bot runs drops real-PR syncs.
  sync-changelog:
    needs: update-settings-docs
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git as the GitHub App Bot
        run: |
          APP_USER_ID=$(gh api "/users/jellyrock[bot]" --jq .id)
          git config --global user.name "jellyrock[bot]"
          git config --global user.email "${APP_USER_ID}+jellyrock[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine sync type
        id: sync_type
        run: |
          # Check if this push contains a new tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          PREVIOUS_HEAD=$(git rev-parse HEAD~1 2>/dev/null || echo "")

          if [ -n "$LATEST_TAG" ] && [ -n "$PREVIOUS_HEAD" ]; then
            # Check if the tag was created in this push (tag points to HEAD but not to previous HEAD)
            TAG_COMMIT=$(git rev-list -n 1 "$LATEST_TAG" 2>/dev/null || echo "")
            CURRENT_COMMIT=$(git rev-parse HEAD)

            if [ "$TAG_COMMIT" = "$CURRENT_COMMIT" ]; then
              # Check if this tag didn't exist in the previous commit
              if ! git merge-base --is-ancestor "$LATEST_TAG" "$PREVIOUS_HEAD" 2>/dev/null; then
                # New tag was created, extract version number
                VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
                echo "type=release" >> $GITHUB_OUTPUT
                echo "version=$VERSION" >> $GITHUB_OUTPUT
                echo "🚀 New tag detected: $LATEST_TAG, processing as release $VERSION"
                exit 0
              fi
            fi
          fi

          # Default to unreleased
          echo "type=unreleased" >> $GITHUB_OUTPUT
          echo "📝 Push to main: processing as unreleased"

      - name: Sync release changes
        if: steps.sync_type.outputs.type == 'release'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "🚀 Converting unreleased changes to release ${{ steps.sync_type.outputs.version }}..."
          npm run changelog:sync-release ${{ steps.sync_type.outputs.version }}

      - name: Sync unreleased changes
        if: steps.sync_type.outputs.type == 'unreleased'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "🔄 Syncing unreleased changes to changelog..."
          npm run changelog:sync-unreleased

      - name: Validate changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "🔍 Validating changelog consistency..."
          npm run changelog:validate

      - name: Commit changes if needed
        run: |
          if git diff --quiet HEAD -- CHANGELOG.md; then
            echo "ℹ️ No changelog changes needed"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            git pull --rebase --autostash origin main
            git add CHANGELOG.md

            if [ "${{ steps.sync_type.outputs.type }}" = "release" ]; then
              echo "📝 Committing release changelog sync for v${{ steps.sync_type.outputs.version }}"
              git commit -m "chore:(docs) convert unreleased section to v${{ steps.sync_type.outputs.version }} release"
            else
              echo "📝 Committing unreleased changelog sync"
              git commit -m "chore:(docs) sync unreleased changelog entries"
            fi

            echo "has_changes=true" >> $GITHUB_ENV
          fi

      - name: Push changes
        if: env.has_changes == 'true'
        run: git push origin main

      - name: Verify final state
        run: |
          echo "✅ Changelog sync completed"
          echo "📊 Final changelog state:"
          npm run changelog:status
