name: lint-translation-files
on:
  pull_request:
    paths:
      - "locale/custom/*.json"
      - "source/**/*.bs"
      - "components/**/*.bs"
      - "components/**/*.xml"
      - "settings/settings.json"
      - "scripts/update-translations.cjs"

jobs:
  run:
    uses: ./.github/workflows/_lint-translation-files.yml
