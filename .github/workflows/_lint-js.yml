name: lint-js

# Lints repo-wide JS / CJS / ESM via ESLint and verifies Prettier formatting
# on the curated JS + JSON set. Mirrors the pre-push hook check steps.
#
# What this catches that the pre-push hook would too:
#   - Missing renderable JS errors (no-unused-vars, prefer-const, eqeqeq, etc.)
#   - Drift between local Prettier output and committed code
#   - Missing `node:` protocol on built-in imports in ESM
#
# Pre-push enforces the same; CI is the safety net for `--no-verify` and
# the per-PR mandatory gate for fork PRs (where pre-push hooks don't fire).

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # Triggers when any JS/CJS/MJS or JSON changes, plus the lint configs
          # themselves (so a config tweak gets validated).
          pattern: '\.(js|cjs|mjs|json)$|^eslint\.config\.js$|^\.prettierrc(\.json)?$|^\.prettierignore$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:js
      - if: steps.detect.outputs.relevant == 'true'
        run: npm run check-formatting:js
      # The Roku device dictionary (scripts/data/roku-hardware.json) is GENERATED, and
      # this job's `\.(js|cjs|mjs|json)$` filter already matches both it and its
      # generator — so it is the cheapest correct home rather than a new workflow pair.
      # Offline: it validates the committed dataset's invariants and its tamper
      # checksum, never the network. Drift against Roku's upstream table is a separate
      # concern, handled by roku-hardware-sync.yml on a schedule.
      - if: steps.detect.outputs.relevant == 'true'
        name: Check Roku device dictionary integrity
        run: npm run roku-hardware:check
