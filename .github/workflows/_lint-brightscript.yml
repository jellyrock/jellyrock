name: lint-brightscript

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  bslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # Mirrors the previous event-time paths filter (**/*.brs, **/*.bs).
          pattern: '\.(brs|bs)$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Cache ropm dependencies
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            source/roku_modules
            components/roku_modules
          key: ropm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: ropm-
      - if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - if: steps.detect.outputs.relevant == 'true'
        run: npm run validate
      - if: steps.detect.outputs.relevant == 'true'
        run: npm run check-formatting:bs
