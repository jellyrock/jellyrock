name: lint-brightscript

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  bslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # Mirrors the previous event-time paths filter (**/*.brs, **/*.bs), plus
          # the non-source inputs the checks below read: the promise-ratchet's
          # committed baseline (a PR that only edits the integer must re-run the
          # ratchet), the ratchet script itself, and the three source-shape guards
          # below. Each reads only .bs/.brs, so a PR that edits ONE OF THE CHECKS
          # rather than a source file would otherwise skip the job that runs it —
          # i.e. the guard could be weakened by a change that never re-runs it. The
          # thread-release check additionally imports its helpers from the
          # auth-binding check, so an edit to either can change what both gate.
          pattern: '\.(brs|bs)$|^\.promise-ratchet-baseline$|^scripts/lint/(promise-ratchet\.cjs|socket-auth-binding-check\.js|socket-thread-release-check\.js|log-manager-init-check\.js)$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Cache ropm dependencies
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            source/roku_modules
            components/roku_modules
          key: ropm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: ropm-
      - if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - if: steps.detect.outputs.relevant == 'true'
        run: npm run validate
      - if: steps.detect.outputs.relevant == 'true'
        run: npm run check-formatting:bs
      # Static guard on the ws:// session-identity binding (#743). Cast commands are
      # delivered to the wrong Jellyfin session if the Authorization header stops
      # reaching the upgrade handshake — silently, with no crash and no failing test.
      # An end-to-end check is unreachable from RTA (it drives an https:// demo server,
      # and the ws:// receiver only runs on http://), so this guards the source shape
      # that the manual on-device verification in PR #747 validated.
      - name: Check ws:// DeviceId binding is intact
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:socket-auth-binding
      # Guards the roku-log manager's single init site. A Logger built before the
      # manager exists caches `invalid` and silently no-ops forever — no output, no
      # error, on any build. Rooibos can't catch it (bsconfig-tests-unit excludes
      # source/Main.bs and BaseTestSuite provisions its own rLog), so this static
      # gate is the only automated cover. Scans .bs sources — same filter as above.
      - name: Check roku-log manager init contract
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:log-manager-init
      # Static guard on release of the ws:// socket Task thread (epic #728). A Task
      # thread is not released by dropping the node reference, and the loop-exit
      # ordering that releases it is subtle: testing a drained port AFTER m.ws.run()
      # strands the terminal on_close, killing the cast channel with no crash and no
      # failing test. Same unreachable-from-RTA path as the binding check above.
      - name: Check ws:// socket thread is released
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:socket-thread-release
      # #551 anti-backslide ratchet: FAILs when net-new raw `observeField("isDone")`
      # observer-spaghetti lands against the committed baseline. Advisory at pre-push
      # (`|| true`) so a local push isn't blocked — this is where it actually blocks.
      # It scans .bs sources, which this job's path filter already matches.
      - name: Check promise-adoption ratchet
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:promise-ratchet
