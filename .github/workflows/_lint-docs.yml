name: lint-docs

# Validates doc references, generated indexes, and CI workflow sync:
#   - lint:docs              — related-files paths, markdown links, tech-debt anchors
#   - docs:dev-index:check   — drift on the auto-generated dev-guides index in
#                              docs/architecture/README.md
#   - docs:stale:blocking    — conditional hard gate (only fails if this PR
#                              touches a stale doc's related-files without
#                              also updating the doc; see lint/docs-stale-blocking.cjs)
#   - lint:ci-workflow-sync  — verifies every _lint-*.yml / _test-*.yml /
#                              _smoke-test-*.yml reusable is listed in
#                              _validate-dependencies.yml so dep-update PRs
#                              can't silently skip a check
#
# These checks run only in .husky/pre-push otherwise — fork PRs and pushes
# with --no-verify bypass that hook entirely. Running them in CI closes
# the gap.
#
# Note: the underlying scripts use only Node stdlib (fs, path), so no
# `npm ci` step is needed.

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # lint/docs-stale-blocking.cjs needs origin/main for the diff
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # Mirrors the previous event-time paths filter (**/*.md, docs/**,
          # the four docs-related scripts, **/CLAUDE.md, AGENTS.md). The
          # \.md$ alternative covers **/CLAUDE.md and AGENTS.md by extension.
          pattern: '\.md$|^docs/|^scripts/lint/(docs-check|docs-stale|docs-stale-blocking|validate-deps-workflow-sync)\.cjs$|^scripts/lint/ci-parity-check\.js$|^scripts/generate/dev-index\.cjs$|^\.github/workflows/_.*\.yml$|^package\.json$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: "lts/*"
      - name: Validate doc references
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/docs-check.cjs
      - name: Check dev-index drift
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/generate/dev-index.cjs --check
      - name: Conditional stale-doc gate
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/docs-stale-blocking.cjs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - name: Validate _validate-dependencies.yml workflow sync
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/validate-deps-workflow-sync.cjs
      # Sibling meta-check, one layer up: the workflow-sync above proves every
      # reusable is wired into the dependency orchestrator; this proves every check
      # in `npm run lint` is wired into SOME workflow. CI never runs the aggregate,
      # so without this a locally-added check silently gates nothing.
      - name: Validate CI runs every `npm run lint` check
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/ci-parity-check.js
