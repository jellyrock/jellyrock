name: lint-docs

# Validates doc references, generated indexes, and CI workflow sync:
#   - lint:docs:               related-files paths, markdown links, tech-debt anchors
#   - lint:comment-voice:      per-file ratchet on the house voice in the comments
#                              of tracked code (see docs/dev/writing-style.md)
#   - lint:voice:              per-file ratchet on the house voice and line-number
#                              citations in tracked markdown (see
#                              .claude/rules/derive-dont-duplicate.md and
#                              docs/dev/writing-style.md)
#   - lint:skill-placeholders: no argument placeholders in .claude/skills/*/SKILL.md,
#                              which Claude Code would replace at run time
#   - docs:dev-index:check:    drift on the auto-generated dev-guides index in
#                              docs/architecture/README.md
#   - docs:stale:blocking:     conditional hard gate (only fails if this PR
#                              touches a stale doc's related-files without
#                              also updating the doc; see lint/docs-stale-blocking.cjs)
#   - lint:ci-workflow-sync:   verifies every _lint-*.yml / _test-*.yml /
#                              _smoke-test-*.yml reusable is listed in
#                              _validate-dependencies.yml so dep-update PRs
#                              can't silently skip a check
#
# These checks run only in .husky/pre-push otherwise, and fork PRs and pushes
# with --no-verify bypass that hook entirely. Running them in CI closes
# the gap.
#
# `npm ci` is needed because comment-voice-ratchet.js reads code comments with
# the BrighterScript lexer, espree and yaml. The other scripts use only the
# Node standard library, and voice-check.sh needs bash and git.

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # lint/docs-stale-blocking.cjs needs origin/main for the diff
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # The code extensions and `.husky/` hooks are here because the same ratchet
          # counts house-voice hits in code comments, so any code change can move it.
          # The voice-check script, its fence filter and its two config files are here
          # because they decide what the markdown check counts.
          #
          # Mirrors the previous event-time paths filter (**/*.md, docs/**,
          # the four docs-related scripts, **/CLAUDE.md, AGENTS.md). The
          # \.md$ alternative covers **/CLAUDE.md and AGENTS.md by extension.
          #
          # `^package\.json$` is here for TWO reasons, the first being the one
          # that makes it a docs concern rather than an odd exception:
          #   1. build-and-tooling.md declares package.json in its related-files,
          #      so the `docs:stale:blocking` step below must see package.json
          #      edits. Without this, that doc's most-frequently-touched related
          #      file was a blind spot for the stale gate on every non-dependency
          #      PR (dependency PRs already reach here via force: true).
          #   2. package.json IS the `npm run lint` aggregate that ci-parity
          #      reconciles, so a PR adding a check to it must re-run that check.
          #      (`_test-scripts.yml` also matches package.json and its vitest
          #      suite asserts the same invariant: belt and braces, not the
          #      primary reason.)
          pattern: '\.md$|\.(bs|brs|js|cjs|mjs|xml|ya?ml|sh)$|^\.husky/[^/]+$|^docs/|^scripts/lint/(docs-check|docs-stale|docs-stale-blocking|validate-deps-workflow-sync)\.cjs$|^scripts/lint/comment-voice-ratchet\.js$|^\.doc-voice-baseline\.json$|^\.voice-baseline\.tsv$|^\.voice-ignore$|^\.claude/skills/log/(voice-check\.sh|md-skip\.awk)$|^scripts/lint/ci-parity-check\.js$|^scripts/generate/dev-index\.cjs$|^\.github/workflows/_.*\.yml$|^package\.json$|^\.claude/skills/log/journal\.(sh|conf)$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: "lts/*"
          cache: "npm"
      - if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - name: Followup journal format
        if: steps.detect.outputs.relevant == 'true'
        run: bash .claude/skills/log/journal.sh check
      - name: Validate doc references
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/docs-check.cjs
      - name: House voice in code comments
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/comment-voice-ratchet.js
      - name: House voice
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:voice
      - name: No argument placeholders in skills
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:skill-placeholders
      - name: Check dev-index drift
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/generate/dev-index.cjs --check
      - name: Conditional stale-doc gate
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/docs-stale-blocking.cjs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - name: Validate _validate-dependencies.yml workflow sync
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/validate-deps-workflow-sync.cjs
      # Sibling meta-check, one layer up: the workflow-sync above proves every
      # reusable is wired into the dependency orchestrator; this proves every check
      # in `npm run lint` is wired into SOME workflow. CI never runs the aggregate,
      # so without this a locally-added check silently gates nothing.
      - name: Validate CI runs every `npm run lint` check
        if: steps.detect.outputs.relevant == 'true'
        run: node scripts/lint/ci-parity-check.js
