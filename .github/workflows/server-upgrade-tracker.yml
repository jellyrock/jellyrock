name: server-upgrade tracker

# Proactive CI for the server-upgrade-automation pipeline
# (docs/architecture/server-upgrade-automation.md). The one fully-autonomous,
# zero-judgment surface: it maintains the PER-VERSION release-triage DIGEST issues
# that nudge a human to triage a new Jellyfin stable release. It never files
# per-finding issues (that stays human-gated behind `/server-upgrade execute`,
# which files them as sub-issues of the digest) and never writes the repo or the
# journals.
#
# Behavior (per-version digests, mirroring docs-stale-tracker.yml's
# single-issue lifecycle but keyed on the version, not one rolling issue):
#   - Detects the latest Jellyfin STABLE (RCs excluded) and compares it to the
#     reviewed anchor: the newest committed stable fingerprint (reviewedAnchor()).
#   - action 'none'   (caught up): do nothing. Acknowledging != work done, so the
#     first design's "close on caught-up" (a single rolling issue, Phase 4 in the
#     design doc's History, which never ran) is intentionally GONE.
#   - action 'clean'  (≥1 newer release, 0 candidates touch us): a judgment-free
#     claim, so open-then-close the version's digest as a persistent audit record
#     (the only CI close). Counts come from an EPHEMERAL in-CI fingerprint (nothing
#     committed, which preserves the reviewed-anchor invariant).
#   - action 'triage' (≥1 candidate, or degraded): open/refresh the version's digest
#     with the mechanical checklist UNTIL it's first triaged (it carries
#     `server-upgrade:triaging`, added by /server-upgrade). Then HAND OFF: never
#     overwrite or close it. A candidate-bearing digest is closed only by a human /
#     the skill.
#
# One digest issue PER version (label `server-upgrade:tracker`, found by its
# version-stamped title); they stack as a per-release audit trail.
#
# Release candidates: when one is in flight, open ONE issue per RC (label
# `server-upgrade:rc`, found by exact title, any state) naming the local
# `/server-upgrade <from> <rc>` command. Never refreshed or closed by CI: closing it
# is the acknowledgment, and the next RC of that version diffs from it.

on:
  schedule:
    # Daily at 12:00 UTC. Jellyfin can ship more than one (hot)fix in a week, so
    # weekly could miss a release for up to 7 days. Daily is cheap: a run
    # short-circuits to a sub-second version-compare when caught up: the spec
    # fetch + report compute only happen when a newer stable exists.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the detected latest stable (testing); blank = fetch live'
        required: false
      rc:
        description: 'With version: the release candidate in flight (testing); blank = none'
        required: false

# Permissions are unused when authenticating as the JellyRock GitHub App (the
# App's installation permissions apply instead). They are kept for clarity and as a
# fallback for forks where APP_PRIVATE_KEY isn't available.
permissions:
  contents: read
  issues: write

# Serialize runs: a manual workflow_dispatch could otherwise overlap the daily
# cron, and both resolve the same per-version digest by title-match dedup, so two
# concurrent runs could each see "no digest" and double-create. Queue rather than
# cancel so an in-flight run finishes its GH-write sequence cleanly.
concurrency:
  group: server-upgrade-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate JellyRock app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # The tracker script needs js-yaml + the spec fetch/diff helpers.
      - name: Install dependencies
        run: npm ci

      - name: Ensure tracker labels exist
        run: |
          gh label create server-upgrade:tracker --color 1D76DB --description "Per-version Jellyfin release-triage digest (run /server-upgrade)" --force
          gh label create server-upgrade:triaging --color FBCA04 --description "A server-upgrade digest /server-upgrade has triaged — CI hands off the body" --force
          gh label create server-upgrade:rc --color C5DEF5 --description "A Jellyfin release candidate to triage locally with /server-upgrade" --force
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # List every per-version digest ONCE (any state). Feeds two consumers:
      #   1) the render step below (--tracker-issues), for the "Mechanically cleared
      #      through" header line, so a trailing diff anchor reads as "cleared up
      #      to here" rather than a stale baseline.
      #   2) the dedup step further down (jq title-match), to find THIS version's
      #      digest.
      # It replaces the dedup step's own list call, hoisted earlier and shared (a
      # caught-up run, which skips the dedup step, now makes this one call too).
      # Runs after the label-ensure step so the label always exists.
      - name: List tracker digests
        run: |
          set -euo pipefail
          gh issue list --label server-upgrade:tracker --state all \
            --json number,title,state,labels --limit 100 > /tmp/digests.json
          echo "Listed $(jq length /tmp/digests.json) tracker digest(s)."
          gh issue list --label server-upgrade:rc --state all \
            --json number,title,state --limit 100 > /tmp/rc-issues.json
          echo "Listed $(jq length /tmp/rc-issues.json) release-candidate issue(s)."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Detect release + render digest body
        id: detect
        env:
          VERSION: ${{ github.event.inputs.version }}
          RC: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          ARGS=(--body-out /tmp/digest-body.md --tracker-issues /tmp/digests.json \
            --rc-issues /tmp/rc-issues.json --rc-body-out /tmp/rc-body.md)
          if [ -n "$VERSION" ]; then
            ARGS+=(--latest "$VERSION")
            if [ -n "$RC" ]; then ARGS+=(--rc "$RC"); fi
          fi
          node scripts/server-upgrade-tracker.js "${ARGS[@]}" > /tmp/decision.json
          cat /tmp/decision.json
          {
            echo "action=$(jq -r .action /tmp/decision.json)"
            echo "version=$(jq -r .version /tmp/decision.json)"
            echo "title=$(jq -r '.title // empty' /tmp/decision.json)"
            echo "rc_title=$(jq -r '.rc.title // empty' /tmp/decision.json)"
          } >> "$GITHUB_OUTPUT"

      # One issue per release candidate, opened once. Matched by exact title among
      # every server-upgrade:rc issue (any state), so a closed (acknowledged) RC is
      # never reopened or duplicated.
      - name: Open release-candidate issue
        if: steps.detect.outputs.rc_title != ''
        run: |
          set -euo pipefail
          NUM=$(jq -r --arg t "$RC_TITLE" 'map(select(.title == $t)) | .[0].number // ""' /tmp/rc-issues.json)
          if [ -n "$NUM" ]; then
            echo "Release-candidate issue #$NUM already exists — nothing to do."
          else
            echo "Opening release-candidate issue: $RC_TITLE"
            gh api "repos/$GITHUB_REPOSITORY/issues" \
              -f "title=$RC_TITLE" \
              -F "body=@/tmp/rc-body.md" \
              -f "labels[]=server-upgrade:rc" >/dev/null
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RC_TITLE: ${{ steps.detect.outputs.rc_title }}

      # Find THIS version's digest (per-version: matched by exact title among the
      # tracker-labelled issues, any state) and whether it's already been triaged.
      - name: Find this version's digest
        id: existing
        if: steps.detect.outputs.action != 'none'
        run: |
          set -euo pipefail
          # Match the title EXACTLY in jq against the shared /tmp/digests.json from
          # the "List tracker digests" step. The title carries brackets + an
          # em-dash that gh's --search would mangle, and reusing the file avoids a
          # second list call.
          MATCH=$(jq -c --arg t "$TITLE" 'map(select(.title == $t)) | .[0] // {}' /tmp/digests.json)
          NUM=$(echo "$MATCH" | jq -r '.number // ""')
          STATE=$(echo "$MATCH" | jq -r '.state // ""')
          TRIAGED=$(echo "$MATCH" | jq -r '[.labels[]?.name] | index("server-upgrade:triaging") != null')
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "triaged=$TRIAGED" >> "$GITHUB_OUTPUT"
          echo "Digest for this version: ${NUM:-none} (state=${STATE:-n/a}, triaged=$TRIAGED)"
        env:
          # No gh call here anymore (reads the shared /tmp/digests.json); only TITLE needed.
          TITLE: ${{ steps.detect.outputs.title }}

      # triage: open or refresh the digest until it's been triaged, then hand off.
      - name: Open or refresh triage digest
        if: steps.detect.outputs.action == 'triage'
        run: |
          set -euo pipefail
          # ROOT CAUSE (resolved): the GitHub App installation lacked the Issues
          # permission, so the token could create an issue but not comment, attach a
          # label, or list: every non-create write returned HTTP 403 "Resource not
          # accessible by integration" (REST *and* GraphQL alike; REST is not a
          # workaround for the 403, the permission grant is the fix). Granting the App
          # Issues: read & write fixed it. We use REST `gh api` here regardless because
          # it creates + labels atomically (so the digest is immediately visible to
          # the label-keyed dedup in "Find this version's digest", avoiding a
          # duplicate) and returns the number directly (no URL parsing).
          if [ -z "$NUM" ]; then
            echo "Opening new triage digest"
            gh api "repos/$GITHUB_REPOSITORY/issues" \
              -f "title=$TITLE" \
              -F "body=@/tmp/digest-body.md" \
              -f "labels[]=server-upgrade:tracker" >/dev/null
          elif [ "$TRIAGED" = "true" ]; then
            echo "Digest #$NUM already triaged (server-upgrade:triaging) — CI hands off, leaving it to /server-upgrade."
          elif [ "$STATE" = "OPEN" ]; then
            echo "Refreshing untriaged digest #$NUM"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$NUM" -F "body=@/tmp/digest-body.md" >/dev/null
          else
            echo "Digest #$NUM is closed and untriaged — respecting the human close (a candidate-bearing digest is closed only by a human)."
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TITLE: ${{ steps.detect.outputs.title }}
          NUM: ${{ steps.existing.outputs.number }}
          TRIAGED: ${{ steps.existing.outputs.triaged }}
          STATE: ${{ steps.existing.outputs.state }}

      # clean: open-then-close the digest as a judgment-free audit record.
      - name: Open-then-close clean digest (audit record)
        if: steps.detect.outputs.action == 'clean'
        run: |
          set -euo pipefail
          CLOSE_MSG="Mechanically clean — nothing JellyRock uses changed in this release, and every post-floor endpoint we call is a known, handled case. Closing automatically as a record (a judgment-free claim)."
          # See the ROOT CAUSE note in the triage step above: the App installation
          # was missing the Issues permission (HTTP 403 on every non-create write,
          # REST and GraphQL alike); granting Issues: read & write fixed it. REST
          # `gh api` is used here because the create call attaches the label
          # atomically (dedup-visible) and returns the number directly.
          if [ -z "$NUM" ]; then
            echo "Opening clean record digest"
            NEW_NUM=$(gh api "repos/$GITHUB_REPOSITORY/issues" \
              -f "title=$TITLE" \
              -F "body=@/tmp/digest-body.md" \
              -f "labels[]=server-upgrade:tracker" \
              --jq '.number')
            gh api "repos/$GITHUB_REPOSITORY/issues/$NEW_NUM/comments" -f "body=$CLOSE_MSG" >/dev/null
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$NEW_NUM" -f state=closed >/dev/null
          elif [ "$TRIAGED" = "true" ]; then
            echo "Digest #$NUM already triaged — CI hands off."
          elif [ "$STATE" = "OPEN" ]; then
            echo "Untriaged digest #$NUM went clean — updating + closing as a record"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$NUM" -F "body=@/tmp/digest-body.md" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" -f "body=$CLOSE_MSG" >/dev/null
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$NUM" -f state=closed >/dev/null
          else
            echo "Clean digest #$NUM already closed — nothing to do."
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TITLE: ${{ steps.detect.outputs.title }}
          NUM: ${{ steps.existing.outputs.number }}
          TRIAGED: ${{ steps.existing.outputs.triaged }}
          STATE: ${{ steps.existing.outputs.state }}
