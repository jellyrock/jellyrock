name: lint-floor-system

# Runs the floor-governance lints of the server-upgrade-automation
# pipeline (docs/architecture/server-upgrade-automation.md):
#
#   - lint:endpoint-availability: validates each endpoint-availability ledger
#     entry's CODE claim (the version-guard symbol still exists in source/, the
#     dispatch-sibling is still a floor-tier manifest endpoint, no dead entries).
#     Reads the .bs files under source/ and components/, so a `.bs` change can
#     flip its verdict.
#   - lint:floor-coverage: proactive PR-time check, FAILs when JellyRock's own
#     commit starts calling an endpoint absent from the 10.7.0 floor spec with no
#     ledger entry / guard (symmetry advisories warn, don't block).
#   - lint:apiversion-consistency: static cross-check that resolveApiVersion() in
#     source/utils/misc.bs agrees with the jellyfin-version-boundaries.yml tier map
#     (parses the .bs with the BrighterScript AST). Catches a half-built apiVersion
#     tier (the YAML and the dispatch twin drifting) without any Roku hardware.
#
# The three lints and the API usage manifest check are offline Node tooling (no
# build, no network, no hardware), so running them behind one path gate is cheap.
# Combining them also gives lint:endpoint-availability its only CI home, since it
# otherwise ran only in the local `npm run lint` aggregate.
#
# One step is not offline: docs:spec-fingerprints:check re-derives each committed
# spec fingerprint from the Jellyfin OpenAPI spec it fetches from api.jellyfin.org.
# The gate above matches every source/**/*.bs, so reusing it would pay that fetch
# on most PRs. The step has its own narrower filter (the `detect-fingerprints`
# step) and only PRs that touch the fingerprints, the generator or the fetch helpers
# run it. It is not in `npm run lint` or pre-push for the same reason.

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  floor-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone github repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^source/.*\.bs$|^components/.*\.bs$|^docs/architecture/api-usage-manifest\.json$|^docs/architecture/spec-fingerprints/jellyfin-|^docs/dev/jellyfin-version-boundaries\.yml$|^docs/dev/jellyfin-endpoint-availability\.yml$|^\.api-watch/suppressions\.yml$|^scripts/lint/floor-coverage-check\.js$|^scripts/lint/endpoint-availability-check\.cjs$|^scripts/lint/apiversion-consistency-check\.js$|^scripts/generate/findings-candidates\.js$|^scripts/generate/api-usage-manifest\.js$|^scripts/lib/version-boundaries\.cjs$|^scripts/lib/endpoint-availability\.cjs$'
          force: ${{ inputs.force }}
      - id: detect-fingerprints
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^docs/architecture/spec-fingerprints/|^scripts/generate/spec-fingerprint\.js$|^scripts/lib/spec-fetch\.cjs$|^scripts/lib/signals-fetch\.cjs$'
          force: ${{ inputs.force }}
      - name: Setup Node.js
        if: steps.detect.outputs.relevant == 'true' || steps.detect-fingerprints.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies
        if: steps.detect.outputs.relevant == 'true' || steps.detect-fingerprints.outputs.relevant == 'true'
        run: npm ci
      - name: Validate endpoint-availability ledger
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:endpoint-availability
      - name: Check floor coverage (proactive)
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:floor-coverage
      - name: Check apiVersion twin consistency (boundaries ↔ resolveApiVersion)
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:apiversion-consistency
      # The API usage manifest is an INPUT to this job's own path filter (floor
      # analysis reasons over it), so stale drift here corrupts the checks above.
      # Pre-push regenerates it as an auto-fix, but that is skipped on a dirty tree
      # and bypassed by --no-verify or a GitHub-UI edit; this is the real gate.
      - name: Check API usage manifest drift
        if: steps.detect.outputs.relevant == 'true'
        run: npm run docs:api-manifest:check
      # Fetches specs from api.jellyfin.org, so it has its own path filter (see the
      # header). The fetch lands in the gitignored .api-watch/cache/.
      - name: Check spec fingerprint drift
        if: steps.detect-fingerprints.outputs.relevant == 'true'
        run: npm run docs:spec-fingerprints:check
