name: lint-markdown

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone github repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # Mirrors the previous event-time paths filter (**/*.md).
          pattern: '\.md$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Cache ropm dependencies
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            source/roku_modules
            components/roku_modules
          key: ropm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: ropm-
      - name: Install npm dependencies
        if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - if: steps.detect.outputs.relevant == 'true'
        uses: xt0rted/markdownlint-problem-matcher@1a5fabfb577370cfdf5af944d418e4be3ea06f27 # v3
      - name: Lint markdown files
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:markdown
