name: lint-brightscript

# No event-time `paths:` filter: .github/actions/changed-paths says why.
# The reusable workflow short-circuits internally when no file its
# changed-paths `pattern:` matches has changed, so this can be wired as a
# required check without stalling PRs that touch none of them.
on:
  pull_request:

jobs:
  bslint:
    uses: ./.github/workflows/_lint-brightscript.yml
