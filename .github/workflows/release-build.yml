name: Finalize Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  finalize-release:
    runs-on: ubuntu-latest
    concurrency:
      group: jellyrock-bot-main
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git as the GitHub App Bot
        run: |
          APP_USER_ID=$(gh api "/users/jellyrock[bot]" --jq .id)
          git config --global user.name "jellyrock[bot]"
          git config --global user.email "${APP_USER_ID}+jellyrock[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Extract version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "🏷️ Finalizing release for version $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update changelog for release
        run: |
          echo "📝 Converting unreleased changes to release ${{ steps.version.outputs.version }}"
          node scripts/changelog-syncer.js sync-release "${{ steps.version.outputs.version }}"

      - name: Commit changelog update
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "ℹ️ No changelog changes to commit"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            # Switch to main branch and apply the changelog changes
            git stash push -m "changelog updates" CHANGELOG.md
            git checkout main
            git pull --rebase origin main
            git stash pop

            git add CHANGELOG.md
            git commit -m "chore:(docs) finalize changelog for v${{ steps.version.outputs.version }}"
            echo "has_changes=true" >> $GITHUB_ENV
            echo "✅ Prepared changelog for release ${{ steps.version.outputs.version }}"
          fi

      - name: Push changes
        if: env.has_changes == 'true'
        run: git push origin main

      - name: Release Summary
        run: |
          echo "🎉 Release ${{ steps.version.outputs.version }} finalized!"
          echo "📋 Changelog updated with release notes"
          echo "🔗 Release published at: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}"
