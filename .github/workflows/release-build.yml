name: Finalize Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  finalize-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: jellyrock-bot-main
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git as the GitHub App Bot
        run: |
          APP_USER_ID=$(gh api "/users/jellyrock[bot]" --jq .id)
          git config --global user.name "jellyrock[bot]"
          git config --global user.email "${APP_USER_ID}+jellyrock[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Extract version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "🏷️ Finalizing release for version $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update changelog for release
        run: |
          echo "📝 Converting unreleased changes to release ${{ steps.version.outputs.version }}"
          node scripts/changelog-syncer.js sync-release "${{ steps.version.outputs.version }}"

      - name: Commit changelog and feature-page updates
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          # Switch to main, carrying the changelog edit made on the tag's checkout
          changelog_changed=false
          if ! git diff --quiet CHANGELOG.md; then
            git stash push -m "changelog updates" CHANGELOG.md
            changelog_changed=true
          fi
          git checkout main
          git pull --rebase origin main
          if [ "$changelog_changed" = true ]; then git stash pop; fi

          # Feature pages that said `since: unreleased` in the tagged commit get this version,
          # and the catalog, the features index and the README are written again from them
          node scripts/generate/feature-catalog.cjs . --release "$VERSION" --ref "$TAG_NAME"

          git add CHANGELOG.md docs/user/features docs/feature-catalog.json README.md
          if git diff --cached --quiet; then
            echo "ℹ️ No changelog or feature-page changes to commit"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            git commit -m "chore:(docs) finalize changelog and feature pages for v$VERSION"
            echo "has_changes=true" >> $GITHUB_ENV
            echo "✅ Prepared changelog and feature pages for release $VERSION"
          fi

      - name: Push changes
        if: env.has_changes == 'true'
        run: git push origin main

      - name: Release Summary
        run: |
          echo "🎉 Release ${{ steps.version.outputs.version }} finalized!"
          echo "📋 Changelog updated with release notes"
          echo "🔗 Release published at: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}"
