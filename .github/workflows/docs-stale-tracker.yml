name: journal cursor tracker

# Weekly backstop for ONE signal: the live journal cursor docs/progress.md
# (`last-updated` frontmatter, via progress-cursor-nudge.cjs --json).
#
# This USED to be a hard per-PR gate in lint:docs, but progress.md staleness
# is a property of main — not of any one contributor's PR — so it false-failed
# unrelated PRs (e.g. Renovate dep bumps) that couldn't legitimately fix it.
# It now lives here as a non-blocking weekly signal + the local pre-push /
# session-start nudges. See docs/architecture/system-shape.md.
#
# Why the architecture/dev-guide `last-reviewed` review cycle is NOT here
# anymore: doc freshness is driven by CONTEXTUAL prompts — the end-of-turn
# reminder in scripts/lint/check-touched-related-files.cjs (now covering
# docs/dev/ as well as docs/architecture/) and the 120-day PR gate in
# scripts/lint/docs-stale-blocking.cjs. Both fire while the author is already
# in the doc's territory, which is when a review is cheap. An acontextual
# weekly backlog asks for a cold re-read with no triggering work; it produced
# no reviews at all, and the backlog could never be cleared, so its label
# stayed permanently red and stopped carrying information.
# `npm run docs:stale` still reports the full list on demand.
#
# Behavior:
#   - Maintains a single canonical issue labeled `docs:stale`:
#       - opens it when the cursor is stale
#       - edits its body in place as the numbers change
#       - closes it when the cursor is fresh again
#
# The active developer already gets this signal locally (Stop hook +
# pre-push); this weekly job is the backstop for "nobody's touched the
# cursor in a while" — i.e. stretches with no local hook runs at all.

on:
  schedule:
    - cron: '0 13 * * MON'  # 13:00 UTC every Monday — start of the workweek for most contributors
  workflow_dispatch:

# Permissions are unused when authenticating as the JellyRock GitHub App
# (the App's installation permissions apply instead) — kept for clarity
# and as a fallback for forks where APP_PRIVATE_KEY isn't available.
permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JellyRock app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # progress-cursor-nudge counts non-maintenance commits since last-updated
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      - name: Ensure docs:stale label exists
        run: gh label create docs:stale --color B60205 --description "The docs/progress.md journal cursor is past its freshness threshold" --force
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Compute progress.md cursor freshness
        id: progress
        run: |
          set -euo pipefail
          # progress-cursor-nudge always exits 0; .stale is null when fresh,
          # or { days, commitsSince, lastUpdated } when stale (>7d + non-
          # maintenance commits since). This is the single source of that
          # computation — the local nudges use the same code path.
          node scripts/lint/progress-cursor-nudge.cjs --json > /tmp/progress.json
          if [ "$(jq -c '.stale' /tmp/progress.json)" = "null" ]; then
            echo "progress_stale=0" >> "$GITHUB_OUTPUT"
            echo "progress.md cursor is fresh."
          else
            echo "progress_stale=1" >> "$GITHUB_OUTPUT"
            DAYS=$(jq -r '.stale.days' /tmp/progress.json)
            COMMITS=$(jq -r '.stale.commitsSince' /tmp/progress.json)
            LAST=$(jq -r '.stale.lastUpdated' /tmp/progress.json)
            {
              echo "## Live journal cursor (progress.md)"
              echo ""
              echo "\`docs/progress.md\` \`last-updated\` is **${LAST}** (${DAYS} days ago) with **${COMMITS}** non-maintenance commit(s) since — the live state cursor has drifted from what's actually shipped."
              echo ""
              echo "**How to address:** run \`/done running\` if the in-flight work already shipped, or \`/log followup\` / \`/done <slug>\` to record or close open items — the sanctioned skills bump \`last-updated\` for you. Never hand-edit \`progress.md\`. (This is a non-blocking signal; it never fails a PR.)"
              echo ""
              echo "---"
              echo "_Auto-generated by \`.github/workflows/docs-stale-tracker.yml\`. Edits to this body are overwritten on the next run._"
              echo ""
              echo "_Architecture/dev-doc \`last-reviewed\` freshness is no longer tracked here — it is driven by the end-of-turn related-files reminder and the 120-day PR gate. Run \`npm run docs:stale\` for the full list on demand._"
            } > /tmp/issue-body.md
            cat /tmp/issue-body.md
          fi

      - name: Find existing tracker issue
        id: existing
        run: |
          set -euo pipefail
          ISSUE_NUMBER=$(gh issue list --label docs:stale --state open --limit 1 --json number --jq '.[0].number // ""')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Existing tracker issue: ${ISSUE_NUMBER:-none}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open or update tracker issue
        if: steps.progress.outputs.progress_stale == '1'
        run: |
          set -euo pipefail
          if [ -n "${{ steps.existing.outputs.issue_number }}" ]; then
            echo "Updating existing issue #${{ steps.existing.outputs.issue_number }}"
            gh issue edit "${{ steps.existing.outputs.issue_number }}" --title "📓 Journal cursor freshness" --body-file /tmp/issue-body.md
          else
            echo "Opening new tracker issue"
            gh issue create --title "📓 Journal cursor freshness" --body-file /tmp/issue-body.md --label docs:stale
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Close tracker issue when the cursor is fresh
        if: steps.progress.outputs.progress_stale == '0' && steps.existing.outputs.issue_number != ''
        run: |
          gh issue close "${{ steps.existing.outputs.issue_number }}" --comment "The \`docs/progress.md\` cursor is fresh. Closing automatically — this issue will reopen if it goes stale again.

          Note: architecture/dev-doc \`last-reviewed\` freshness is no longer tracked by this weekly job. It is now driven by contextual prompts — the end-of-turn related-files reminder (\`scripts/lint/check-touched-related-files.cjs\`, which now covers \`docs/dev/\` too) and the 120-day PR gate (\`scripts/lint/docs-stale-blocking.cjs\`). Run \`npm run docs:stale\` for the full list on demand."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
