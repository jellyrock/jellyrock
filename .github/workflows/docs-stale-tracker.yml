name: docs-stale tracker

# Weekly cadence enforcement for the architecture-doc + dev-guide review
# cycle. `last-reviewed` frontmatter is honor-system; this workflow makes
# the staleness visible so the cadence actually happens.
#
# Behavior:
#   - Runs `docs:stale --json` against current repo state
#   - Maintains a single canonical issue labeled `docs:stale`:
#       - opens it when stale docs exist and no issue is open yet
#       - edits its body in place when the list changes
#       - closes it when the list becomes empty
#   - Splits the body into "Architecture (PR-gated at 120 days)" and
#     "Dev guides (informational)" so contributors understand which
#     entries block PRs and which don't
#
# One canonical issue (not per-doc) keeps noise low for solo + occasional-
# fork-PR maintenance. Bulk audits of 3+ docs in the same session are
# token-efficient and catch cross-doc contradictions; the issue body
# nudges that batching with a single checkbox list.

on:
  schedule:
    - cron: '0 13 * * MON'  # 13:00 UTC every Monday — start of the workweek for most contributors
  workflow_dispatch:

# Permissions are unused when authenticating as the JellyRock GitHub App
# (the App's installation permissions apply instead) — kept for clarity
# and as a fallback for forks where APP_PRIVATE_KEY isn't available.
permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JellyRock app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "lts/*"

      - name: Ensure docs:stale label exists
        run: gh label create docs:stale --color B60205 --description "Architecture/dev docs past their last-reviewed threshold" --force
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Compute stale list
        id: stale
        run: |
          set -euo pipefail
          OUTPUT=$(node scripts/docs-stale.cjs --json)
          echo "$OUTPUT" > /tmp/stale.json

          # findings[] has {file, date, days, status} where status is fresh|stale|no-date
          STALE_COUNT=$(jq '[.findings[] | select(.status == "stale" or .status == "no-date")] | length' /tmp/stale.json)
          echo "stale_count=$STALE_COUNT" >> "$GITHUB_OUTPUT"
          echo "Stale doc count: $STALE_COUNT"

      - name: Build issue body
        if: steps.stale.outputs.stale_count != '0'
        id: body
        run: |
          set -euo pipefail
          {
            echo "Weekly snapshot of architecture and dev docs whose \`last-reviewed\` is past threshold."
            echo ""
            echo "**How to address an entry:** re-read the doc against current code, fix any drift, and bump \`last-reviewed\` in the frontmatter. Then check off the line below in your PR — this issue is regenerated weekly and will close automatically once empty."
            echo ""
            echo "**Threshold:** 90 days for the soft signal here. Architecture docs are additionally PR-gated at 120 days via \`scripts/docs-stale-blocking.cjs\` — at 120+ days, any PR that touches a file in the doc's \`related-files\` will block until the doc is updated alongside."
            echo ""
            echo "## Architecture (PR-gated at 120 days)"
            echo ""
            ARCH=$(jq -r '[.findings[] | select((.status == "stale" or .status == "no-date") and (.file | startswith("docs/architecture/")))] | .[] | "- [ ] [\(.file)](../blob/main/\(.file)) — \(if .days != null then "\(.days)d stale" else "no last-reviewed" end)"' /tmp/stale.json)
            if [ -z "$ARCH" ]; then
              echo "_None._"
            else
              echo "$ARCH"
            fi
            echo ""
            echo "## Dev guides (informational)"
            echo ""
            DEV=$(jq -r '[.findings[] | select((.status == "stale" or .status == "no-date") and (.file | startswith("docs/dev/")))] | .[] | "- [ ] [\(.file)](../blob/main/\(.file)) — \(if .days != null then "\(.days)d stale" else "no last-reviewed" end)"' /tmp/stale.json)
            if [ -z "$DEV" ]; then
              echo "_None._"
            else
              echo "$DEV"
            fi
            echo ""
            echo "---"
            echo "_Auto-generated by \`.github/workflows/docs-stale-tracker.yml\`. Edits to this body are overwritten on the next run._"
          } > /tmp/issue-body.md

      - name: Find existing tracker issue
        id: existing
        run: |
          set -euo pipefail
          ISSUE_NUMBER=$(gh issue list --label docs:stale --state open --limit 1 --json number --jq '.[0].number // ""')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Existing tracker issue: ${ISSUE_NUMBER:-none}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open or update tracker issue
        if: steps.stale.outputs.stale_count != '0'
        run: |
          set -euo pipefail
          if [ -n "${{ steps.existing.outputs.issue_number }}" ]; then
            echo "Updating existing issue #${{ steps.existing.outputs.issue_number }}"
            gh issue edit "${{ steps.existing.outputs.issue_number }}" --body-file /tmp/issue-body.md
          else
            echo "Opening new tracker issue"
            gh issue create --title "📚 Stale docs tracker" --body-file /tmp/issue-body.md --label docs:stale
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Close tracker issue when no stale docs
        if: steps.stale.outputs.stale_count == '0' && steps.existing.outputs.issue_number != ''
        run: |
          gh issue close "${{ steps.existing.outputs.issue_number }}" --comment "All architecture + dev docs are within their review threshold. Closing automatically — this issue will reopen if any go stale again."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
