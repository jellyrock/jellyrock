name: lint-spelling

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Clone github repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          # Mirrors the previous event-time paths filter (**/*.md), plus
          # dictionary.txt + its auditor: lint:dictionary runs in this job and
          # dictionary.txt is the spellchecker's own word list.
          #
          # .spellcheckerrc.yaml is the third real input — it owns the dictionary
          # path, the plugin set and the ignore rules for every surface. Without it
          # here, a PR that breaks the config (a bad ignore regex, a dropped plugin)
          # while touching no .md file skips this job and lands green.
          pattern: '\.md$|^dictionary\.txt$|^scripts/lint/dictionary-audit\.cjs$|^\.spellcheckerrc\.ya?ml$'
          force: ${{ inputs.force }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.relevant == 'true'
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Cache ropm dependencies
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            source/roku_modules
            components/roku_modules
          key: ropm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: ropm-
      - name: Install npm dependencies
        if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - name: Check markdown files for spelling errors
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:spelling
      # dictionary.txt is this job's own input, so its hygiene audit belongs here.
      # Flags identifier-shaped entries (PascalCase / camelCase / paths) that should
      # be backticked at the call site instead of whitelisted globally.
      - name: Audit dictionary.txt for identifier-shaped entries
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:dictionary
