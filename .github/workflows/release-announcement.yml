name: Link Release Announcement

# Every published release gets an Announcements discussion, and this workflow is what links
# it: GitHub drops a discussion category set on a draft, so the draft workflows set none.
# It edits the release as the jellyrock GitHub App, so the discussion is posted by
# jellyrock[bot]; the App needs Discussions write. Editing a release is not a "published"
# event, so this never triggers itself.

on:
  release:
    types: [published]
  # Manual run: link a discussion to an older release, or test this workflow
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.3.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  link-announcement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Link an Announcements discussion when the release has none
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          url=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.discussion_url // ""')
          if [ -n "$url" ]; then
            echo "ℹ️ $TAG already links $url"
            exit 0
          fi
          gh release edit "$TAG" --repo "$REPO" --discussion-category "Announcements"
          url=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.discussion_url // ""')
          if [ -z "$url" ]; then
            echo "❌ $TAG still has no discussion after setting the category"
            exit 1
          fi
          echo "✅ $TAG now links $url"
