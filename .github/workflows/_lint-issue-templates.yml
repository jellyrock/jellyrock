name: lint-issue-templates

# Validates .github/ISSUE_TEMPLATE/*.yml against GitHub's issue-forms JSON
# Schema. GitHub silently drops invalid templates from the chooser at
# /issues/new/choose, so structural breakage is otherwise invisible until
# someone tries to file an issue.

on:
  workflow_call:
    inputs:
      force:
        description: 'When true, skip path detection and run unconditionally (used by the dependencies validator).'
        required: false
        type: boolean
        default: false

jobs:
  issue-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Clone github repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^\.github/ISSUE_TEMPLATE/|^scripts/lint/issue-templates-check\.cjs$|^scripts/lint/issue-forms\.schema\.json$'
          force: ${{ inputs.force }}
      - name: Setup Node.js
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies
        if: steps.detect.outputs.relevant == 'true'
        run: npm ci
      - name: Validate issue-form templates
        if: steps.detect.outputs.relevant == 'true'
        run: npm run lint:issue-templates
