name: Roku static analysis

on:
  workflow_dispatch: # allow manual start
  push:
    branches:
      - "v*.*.*" # e.g. v1.0.0, v2.1.3

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Cache ropm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            source/roku_modules
            components/roku_modules
          key: ropm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: ropm-
      - name: NPM install
        run: npm ci
      - name: Build app for production
        run: npm run build:prod
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Cache Static Channel Analysis CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-sca
        with:
          path: sca-cmd
          key: sca-cmd-${{ hashFiles('sca-cmd/bin/sca-cmd') }}
          restore-keys: sca-cmd-
      - name: Download the Static Channel Analysis CLI
        if: steps.cache-sca.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://devtools.web.roku.com/static-channel-analysis/sca-cmd.zip" -o sca-cmd.zip
          unzip sca-cmd.zip
      - name: Run Roku Static Analysis
        run: ./sca-cmd/bin/sca-cmd ${{ github.workspace }}/build --exit error
