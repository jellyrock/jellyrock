name: Roku static analysis

on:
  workflow_dispatch: # allow manual start
  push:
    branches:
      - "v*.*.*" # e.g. v1.0.0, v2.1.3

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Cache ropm dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            source/roku_modules
            components/roku_modules
          key: ropm-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: ropm-
      - name: NPM install
        run: npm ci
      - name: Build app for production
        run: npm run build:prod
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Cache Static Channel Analysis CLI
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache-sca
        with:
          path: sca-cmd
          key: sca-cmd-${{ hashFiles('sca-cmd/bin/sca-cmd') }}
          restore-keys: sca-cmd-
      - name: Download the Static Channel Analysis CLI
        if: steps.cache-sca.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://devtools.web.roku.com/static-channel-analysis/sca-cmd.zip" -o sca-cmd.zip
          unzip sca-cmd.zip
      - name: Run Roku Static Analysis
        run: ./sca-cmd/bin/sca-cmd ${{ github.workspace }}/build --exit error
