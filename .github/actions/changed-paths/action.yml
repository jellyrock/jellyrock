name: 'Detect changed paths'
description: |
  Inspects the current PR's diff and sets `relevant=true` if any changed
  file path matches the supplied extended-regex pattern; otherwise
  `relevant=false`.

  Use inside reusable lint workflows that want to short-circuit when no
  relevant files changed, *without* relying on event-time `paths:` filters.
  Event-time `paths:` filters break required-status-check enforcement —
  if a workflow is wired as a required check but the path filter excludes
  the PR, GitHub never reports a status and the PR sits unmergeable.
  Moving the path-relevance check inside the job lets the workflow always
  queue (and always report a status) while still skipping work when nothing
  relevant changed.

  Computes the changed-file list per event: `pull_request*` via
  `gh pr diff --name-only`, `push` via the compare API over the
  before...after range. Other contexts (workflow_dispatch, schedule) can't
  produce a diff and fall back to `relevant=true` so manual / scheduled runs
  always execute the work. A push with no resolvable base (branch creation,
  all-zero before SHA), a failed compare call, or a truncated (>300-file)
  compare response also falls back to `relevant=true` — never a false skip.

  The pattern is passed to `grep -E` (extended regex) and matched against
  one path per line.

inputs:
  pattern:
    description: 'Extended-regex pattern matched against each changed file path.'
    required: true
  force:
    description: |
      When "true", skip path detection and unconditionally set relevant=true.
      Used by orchestrator workflows (e.g., the dependencies validator) that
      need every linter to run regardless of which source files changed —
      a dep bump can break a linter even when no matching source file was
      touched in the PR.
    required: false
    default: 'false'

outputs:
  relevant:
    description: '"true" if any changed file matches the pattern, "false" otherwise.'
    value: ${{ steps.detect.outputs.relevant }}

runs:
  using: composite
  steps:
    - name: Detect relevant changes
      id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PATTERN: ${{ inputs.pattern }}
        FORCE: ${{ inputs.force }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        run_all() {  # fall back to running the work; never a false skip
          echo "::notice::$1"
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          exit 0
        }

        if [ "$FORCE" = "true" ]; then
          run_all "force=true — skipping path detection, running unconditionally."
        fi

        # Resolve the changed-file list for this event.
        if [ -n "${PR_NUMBER:-}" ]; then
          # gh pr diff --name-only lists files changed by the PR (one per line).
          # No git history needed; works with the default shallow checkout.
          CHANGED=$(gh pr diff "$PR_NUMBER" --name-only)
        elif [ "$EVENT_NAME" = "push" ]; then
          # Branch creation / rewritten base has an all-zero or missing before
          # SHA — no computable range, so run rather than risk a false skip.
          if [ -z "${PUSH_BEFORE:-}" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            run_all "push with no resolvable base — running unconditionally."
          fi
          # compare API returns files changed between the two commits; no local
          # git history needed (mirrors the gh pr diff approach). Any failure
          # (e.g. a force-pushed-away base) falls back to running.
          RESP=$(gh api "repos/${REPO}/compare/${PUSH_BEFORE}...${PUSH_AFTER}" 2>/dev/null) \
            || run_all "compare API failed — running unconditionally."
          # The compare endpoint caps `files` at 300; a capped list can't prove
          # a "no match" (a relevant file may be beyond the cap), so run.
          if [ "$(printf '%s' "$RESP" | jq '.files | length')" -ge 300 ]; then
            run_all "push touched 300+ files (compare truncated) — running unconditionally."
          fi
          CHANGED=$(printf '%s' "$RESP" | jq -r '.files[].filename')
        else
          run_all "no diff available for event '$EVENT_NAME' — running unconditionally."
        fi

        if printf '%s\n' "$CHANGED" | grep -qE -- "$PATTERN"; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Pattern matched — proceeding."
        else
          echo "relevant=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No changed files matched pattern '$PATTERN'; subsequent steps will be skipped (reports success)."
        fi
