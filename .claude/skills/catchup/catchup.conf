# This repo's own reader for catchup-state.sh (its header defines every key).
# This file is the repo's own: a shared-skill update never overwrites it.
reader=node scripts/catchup-state.js --typed --pretty
# Measured at 4.2-4.7 s; the shared default of 30 s leaves room for a slow gh.
# Each banner id's class; within a class, the order of these lines is the rank.
# scripts/lib/catchup-typed.cjs prints them, and its test keeps this list in step.
class.ci-failing=fire
class.handoff-pending=resume
class.signals-stale=overdue
class.review-requested=overdue
class.signals-action-pending=overdue
