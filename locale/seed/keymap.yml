    jellyfin-androidtv: { key: pref_video, en: Video }
    jellyfin-roku: { key: Video, en: Video }

LabelYes:
  en: "Yes"
  from:
    jellyfin-web: { key: "Yes", en: "Yes" }
    jellyfin-androidtv: { key: lbl_yes, en: "Yes" }
    jellyfin-android: { key: "yes", en: "Yes" }
    jellyfin-roku: { key: "Yes", en: "Yes" }

